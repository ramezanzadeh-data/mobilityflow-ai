# One origin in front of Streamlit and the API.
#
# Why this exists
# ---------------
# The browser session token used to travel in the URL query string,
# because Streamlit cannot set an HttpOnly cookie from Python. That meant
# a printed page, a screenshot or a copied link carried a working session
# - which a real printout demonstrated.
#
# The fix is an HttpOnly cookie, and a cookie needs both halves of the
# product to be same-origin. Today they are not: Streamlit answers on
# :8501 and the API on :8000. Cookies ignore the port, so a cookie set by
# the API would in fact reach Streamlit on localhost - but that is a
# development accident, not a design. In production on separate hosts it
# would not hold, and a cross-origin fetch from Streamlit's component
# iframe lands in third-party cookie territory, which browsers
# increasingly block outright.
#
# So: one origin, and the cookie is first-party everywhere.
#
#     localhost/       -> streamlit:8501
#     localhost/api/   -> api:8000
#
# This file changed no authentication. It was deliberately a separate,
# verifiable step: bring both services up under one origin, confirm the
# product still worked exactly as it did, and only then move the session
# into a cookie. A proxy misconfiguration and an auth change landing
# together would have been indistinguishable from each other when
# something broke.
#
# The cookie has since landed on top of this - see auth/browser_session.py
# and apps/api/routes/browser_session.py. Two things here are now
# load-bearing for it, and were not before:
#
#   * /api/ must keep reaching the API. The web app asks the browser to
#     POST /api/session/adopt; if that path stops resolving, the cookie
#     is silently never set.
#   * X-Forwarded-Proto below is what tells the API whether the browser
#     used TLS, and therefore whether to mark the cookie Secure. Remove
#     it and every production session cookie goes out unmarked.

upstream streamlit_upstream {
    server streamlit:8501;
}

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads are PDFs and can be large. nginx defaults to 1m and
    # rejects anything bigger with a 413 before the application sees it,
    # which would look like the upload control silently failing.
    client_max_body_size 32m;

    # The API, under a path prefix rather than a port.
    #
    # The trailing slash on proxy_pass strips /api from the forwarded
    # path, so the API keeps its own routes unchanged - /api/health
    # reaches it as /health. Without it every route would need an /api
    # prefix baked in, which would couple the application to how it
    # happens to be deployed.
    location /api/ {
        proxy_pass http://api_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit's websocket.
    #
    # Declared before the catch-all and with the upgrade headers set.
    # This is the single most common way a Streamlit deployment behind a
    # proxy fails: the page loads, looks correct, and then nothing
    # responds to a click, because the HTTP request succeeded and the
    # websocket never upgraded. Silent, and indistinguishable from a
    # frozen app.
    location /_stcore/stream {
        proxy_pass http://streamlit_upstream/_stcore/stream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # A websocket that carries no traffic while a user reads a case
        # must not be closed as idle. The default 60s would drop the
        # connection and the page would stop responding without an error.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    location / {
        proxy_pass http://streamlit_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
